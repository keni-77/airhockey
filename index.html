<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>エアホッケー（ローカル＆オンライン対戦版）</title>

    <!-- WebRTCライブラリ (PeerJS) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gameContainer {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            background-color: #f4f6f8;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            border: 6px solid #2c3e50;
            max-width: 95vw;
            max-height: 90vh;
            aspect-ratio: 1000 / 600;
        }

        #scoreBoard {
            position: absolute;
            top: 15px;
            width: 85%;
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.9);
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
        }
        .p1-score { color: #2ecc71; text-shadow: 0 0 10px rgba(46,204,113,0.5); }
        .p2-score { color: #3498db; text-shadow: 0 0 10px rgba(52,152,219,0.5); }

        /* マッチポイント表示 */
        #matchPointBanner {
            position: absolute;
            top: 60px;
            font-size: 22px;
            font-weight: 900;
            color: #e74c3c;
            background: rgba(255, 255, 255, 0.95);
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
            display: none;
            z-index: 6;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* モーダル共通 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }

        .dialog-box {
            background: #2c3e50;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 340px;
            width: 80%;
        }

        .dialog-box h2 { margin-top: 0; margin-bottom: 15px; font-size: 28px; }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            transition: 0.2s;
        }
        .btn:disabled { background: #7f8c8d; cursor: not-allowed; }
        .btn-local { background: #f39c12; }
        .btn-local:hover { background: #d35400; }
        .btn-host { background: #2ecc71; }
        .btn-host:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }

        input[type="text"] {
            width: 90%;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #34495e;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #roomCodeDisplay {
            font-size: 32px;
            font-weight: bold;
            color: #f1c40f;
            letter-spacing: 4px;
            margin: 15px 0;
            user-select: all;
        }

        #statusText {
            margin-top: 15px;
            font-size: 14px;
            color: #bdc3c7;
        }

        /* 結果ダイアログ */
        #resultTitle { font-size: 36px; font-weight: 900; margin-bottom: 10px; }
        .win-text { color: #2ecc71; text-shadow: 0 0 15px rgba(46,204,113,0.6); }
        .lose-text { color: #e74c3c; text-shadow: 0 0 15px rgba(231,76,60,0.6); }
        .p1-win-text { color: #2ecc71; text-shadow: 0 0 15px rgba(46,204,113,0.6); }
        .p2-win-text { color: #3498db; text-shadow: 0 0 15px rgba(52,152,219,0.6); }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreBoard">
            <div class="p1-score">1P: <span id="p1Score">0</span></div>
            <div class="p2-score">2P: <span id="p2Score">0</span></div>
        </div>

        <div id="matchPointBanner">MATCH POINT</div>

        <canvas id="gameCanvas" width="1000" height="600"></canvas>

        <!-- モード選択・ロビー画面 -->
        <div id="lobbyOverlay" class="overlay">
            <div class="dialog-box">
                <h2>エアホッケー</h2>
                
                <div id="modeSelectMenu">
                    <button class="btn btn-local" onclick="startLocalGame()">2人プレイ (1台で対戦)</button>
                    <button class="btn" onclick="showOnlineMenu()">オンライン対戦</button>
                </div>

                <div id="onlineMenu" style="display: none;">
                    <button class="btn btn-host" onclick="startHost()">部屋を作る (ホスト)</button>
                    <button class="btn" onclick="showJoinInput()">部屋に入る (ゲスト)</button>
                    <button class="btn" style="background: #7f8c8d;" onclick="showHomeMenu()">戻る</button>
                </div>

                <div id="hostMenu" style="display: none;">
                    <div>あいことば</div>
                    <div id="roomCodeDisplay">----</div>
                    <div>対戦相手の接続を待っています...</div>
                    <button class="btn" style="background: #7f8c8d;" onclick="clickLeave()">キャンセル</button>
                </div>

                <div id="joinMenu" style="display: none;">
                    <input type="text" id="roomInput" placeholder="あいことばを入力" maxlength="5">
                    <button class="btn" onclick="startJoin()">接続する</button>
                    <button class="btn" style="background: #7f8c8d;" onclick="showOnlineMenu()">戻る</button>
                </div>

                <div id="statusText">通信状態: 未接続</div>
            </div>
        </div>

        <!-- 試合終了リザルト画面 -->
        <div id="resultOverlay" class="overlay" style="display: none;">
            <div class="dialog-box">
                <div id="resultTitle">1P WIN!</div>
                <div id="resultScoreDetail" style="margin-bottom: 20px; font-size: 18px; color: #ecf0f1;"></div>
                
                <button id="retryBtn" class="btn btn-host" onclick="clickRetry()">もう一回プレイ</button>
                <button class="btn btn-danger" onclick="clickLeave()">退出する</button>
                <div id="retryStatusText" style="margin-top: 10px; font-size: 14px; color: #f1c40f;"></div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const CANVAS_WIDTH = 1000;
    const CANVAS_HEIGHT = 600;

    const WALL_RESTITUTION = 0.8;
    const MALLET_RESTITUTION = 0.45;
    const FRICTION = 0.985;
    const SUB_STEPS = 10;
    const MAX_PUCK_SPEED = 55;

    const goalHeight = CANVAS_HEIGHT / 2.3;
    const malletRadius = Math.min(CANVAS_WIDTH, CANVAS_HEIGHT) / 12;
    const puckRadius = malletRadius * 0.85;

    let goalTop = CANVAS_HEIGHT / 2 - goalHeight / 2;
    let goalBottom = CANVAS_HEIGHT / 2 + goalHeight / 2;

    let puck = { x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2, r: puckRadius, vx: 0, vy: 0, color: "#e74c3c" };
    let p1 = { x: 120, y: CANVAS_HEIGHT / 2, r: malletRadius, vx: 0, vy: 0, color: "#2ecc71", score: 0 };
    let p2 = { x: CANVAS_WIDTH - 120, y: CANVAS_HEIGHT / 2, r: malletRadius, vx: 0, vy: 0, color: "#3498db", score: 0 };

    let p1Target = { x: p1.x, y: p1.y };
    let p2Target = { x: p2.x, y: p2.y };

    let gameMode = "none"; // "local", "host", "guest"
    let gameState = "lobby"; // "lobby", "playing", "ended"
    let winner = null; // "p1", "p2"
    let matchPointState = null; // "p1", "p2", null

    let peer = null;
    let conn = null;

    // タッチトラッキング (マルチタッチ対応)
    let p1TouchId = null;
    let p2TouchId = null;
    let p1Offset = { x: 0, y: 0 };
    let p2Offset = { x: 0, y: 0 };

    // リトライフラグ
    let p1Retry = false;
    let p2Retry = false;

    function getCanvasPos(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        let scaleX = CANVAS_WIDTH / rect.width;
        let scaleY = CANVAS_HEIGHT / rect.height;

        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    // --- タッチ＆ドラッグ操作処理 (マルチタッチ対応) ---
    function handleTouchStart(e) {
        if (gameState !== "playing") return;

        const touches = e.changedTouches || [e];
        for (let i = 0; i < touches.length; i++) {
            let t = touches[i];
            let id = t.identifier !== undefined ? t.identifier : "mouse";
            let pos = getCanvasPos(t.clientX, t.clientY);

            // ローカル対戦：左半分タッチで1P、右半分タッチで2Pを掴む
            if (gameMode === "local") {
                if (pos.x < CANVAS_WIDTH / 2 && p1TouchId === null) {
                    let dx = pos.x - p1.x, dy = pos.y - p1.y;
                    if (Math.sqrt(dx * dx + dy * dy) <= p1.r * 2.0) {
                        p1TouchId = id;
                        p1Offset = { x: pos.x - p1.x, y: pos.y - p1.y };
                    }
                } else if (pos.x >= CANVAS_WIDTH / 2 && p2TouchId === null) {
                    let dx = pos.x - p2.x, dy = pos.y - p2.y;
                    if (Math.sqrt(dx * dx + dy * dy) <= p2.r * 2.0) {
                        p2TouchId = id;
                        p2Offset = { x: pos.x - p2.x, y: pos.y - p2.y };
                    }
                }
            } 
            // オンライン対戦（ホスト＝1P、ゲスト＝2P）
            else if (gameMode === "host") {
                let dx = pos.x - p1.x, dy = pos.y - p1.y;
                if (Math.sqrt(dx * dx + dy * dy) <= p1.r * 2.0) {
                    p1TouchId = id;
                    p1Offset = { x: pos.x - p1.x, y: pos.y - p1.y };
                }
            } else if (gameMode === "guest") {
                let dx = pos.x - p2.x, dy = pos.y - p2.y;
                if (Math.sqrt(dx * dx + dy * dy) <= p2.r * 2.0) {
                    p2TouchId = id;
                    p2Offset = { x: pos.x - p2.x, y: pos.y - p2.y };
                }
            }
        }
    }

    function handleTouchMove(e) {
        if (gameState !== "playing") return;

        const touches = e.changedTouches || [e];
        for (let i = 0; i < touches.length; i++) {
            let t = touches[i];
            let id = t.identifier !== undefined ? t.identifier : "mouse";
            let pos = getCanvasPos(t.clientX, t.clientY);

            if (p1TouchId === id) {
                p1Target.x = pos.x - p1Offset.x;
                p1Target.y = pos.y - p1Offset.y;
            }
            if (p2TouchId === id) {
                p2Target.x = pos.x - p2Offset.x;
                p2Target.y = pos.y - p2Offset.y;
                if (gameMode === "guest" && conn && conn.open) {
                    conn.send({ type: "input", target: p2Target });
                }
            }
        }
    }

    function handleTouchEnd(e) {
        const touches = e.changedTouches || [e];
        for (let i = 0; i < touches.length; i++) {
            let id = touches[i].identifier !== undefined ? touches[i].identifier : "mouse";
            if (p1TouchId === id) p1TouchId = null;
            if (p2TouchId === id) p2TouchId = null;
        }
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouchStart(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouchMove(e); }, {passive: false});
    canvas.addEventListener('touchend', handleTouchEnd);
    canvas.addEventListener('touchcancel', handleTouchEnd);

    canvas.addEventListener('mousedown', handleTouchStart);
    canvas.addEventListener('mousemove', handleTouchMove);
    window.addEventListener('mouseup', handleTouchEnd);

    // --- メニュー切替 ---
    function setStatus(text) {
        document.getElementById("statusText").innerText = "通信状態: " + text;
    }

    function showHomeMenu() {
        document.getElementById("modeSelectMenu").style.display = "block";
        document.getElementById("onlineMenu").style.display = "none";
        document.getElementById("hostMenu").style.display = "none";
        document.getElementById("joinMenu").style.display = "none";
        setStatus("未接続");
    }

    function showOnlineMenu() {
        document.getElementById("modeSelectMenu").style.display = "none";
        document.getElementById("onlineMenu").style.display = "block";
        document.getElementById("hostMenu").style.display = "none";
        document.getElementById("joinMenu").style.display = "none";
    }

    function showJoinInput() {
        document.getElementById("onlineMenu").style.display = "none";
        document.getElementById("joinMenu").style.display = "block";
    }

    // --- ゲームモード開始処理 ---
    function startLocalGame() {
        gameMode = "local";
        document.getElementById("lobbyOverlay").style.display = "none";
        startNewMatch();
    }

    function startHost() {
        gameMode = "host";
        const roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById("onlineMenu").style.display = "none";
        document.getElementById("hostMenu").style.display = "block";
        document.getElementById("roomCodeDisplay").innerText = roomCode;
        setStatus("部屋を作成中...");

        peer = new Peer("hockey-" + roomCode);

        peer.on('open', () => { setStatus("ゲストの参加待ち"); });
        peer.on('connection', (c) => {
            conn = c;
            setupConnection();
        });
        peer.on('error', (err) => {
            alert("通信エラーが発生しました: " + err);
            clickLeave();
        });
    }

    function startJoin() {
        const inputCode = document.getElementById("roomInput").value.trim().toUpperCase();
        if (!inputCode) return alert("あいことばを入力してください");

        gameMode = "guest";
        setStatus("ホストに接続中...");

        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect("hockey-" + inputCode);
            setupConnection();
        });
        peer.on('error', (err) => {
            alert("接続に失敗しました。あいことばを確認してください。");
            clickLeave();
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            setStatus("接続完了！");
            document.getElementById("lobbyOverlay").style.display = "none";
            if (gameMode === "host") {
                startNewMatch();
            }
        });

        conn.on('data', (data) => {
            if (gameMode === "host") {
                if (data.type === "input") {
                    p2Target = data.target;
                } else if (data.type === "retry") {
                    p2Retry = true;
                    checkBothRetry();
                } else if (data.type === "leave") {
                    alert("対戦相手が退出しました。");
                    clickLeave();
                }
            } else if (gameMode === "guest") {
                if (data.type === "state") {
                    puck = data.puck;
                    p1 = data.p1;
                    p2 = data.p2;
                    gameState = data.gameState;
                    winner = data.winner;
                    matchPointState = data.matchPoint;
                    p1Retry = data.p1Retry;
                    p2Retry = data.p2Retry;

                    document.getElementById('p1Score').innerText = p1.score;
                    document.getElementById('p2Score').innerText = p2.score;

                    updateUIByState();
                } else if (data.type === "leave") {
                    alert("対戦相手が退出しました。");
                    clickLeave();
                }
            }
        });

        conn.on('close', () => {
            alert("対戦相手との通信が切断されました。");
            clickLeave();
        });
    }

    // --- 卓球ルール判定（11点先取・デュース・マッチポイント） ---
    function checkTableTennisRules() {
        let s1 = p1.score;
        let s2 = p2.score;

        // 勝敗チェック (11点以上かつ2点差)
        if ((s1 >= 11 || s2 >= 11) && Math.abs(s1 - s2) >= 2) {
            winner = s1 > s2 ? "p1" : "p2";
            gameState = "ended";
            matchPointState = null;
            updateUIByState();
            return;
        }

        // マッチポイント判定
        if (s1 >= 10 && s1 > s2) {
            matchPointState = "p1";
        } else if (s2 >= 10 && s2 > s1) {
            matchPointState = "p2";
        } else {
            matchPointState = null;
        }

        updateUIByState();
    }

    // --- リトライ・退出 ---
    function clickRetry() {
        if (gameMode === "local") {
            startNewMatch();
        } else {
            document.getElementById("retryBtn").disabled = true;
            document.getElementById("retryStatusText").innerText = "相手の準備待ち...";

            if (gameMode === "host") {
                p1Retry = true;
                checkBothRetry();
            } else if (gameMode === "guest") {
                p2Retry = true;
                if (conn && conn.open) {
                    conn.send({ type: "retry" });
                }
            }
        }
    }

    function checkBothRetry() {
        if (p1Retry && p2Retry) {
            startNewMatch();
        } else {
            updateUIByState();
        }
    }

    function startNewMatch() {
        p1.score = 0;
        p2.score = 0;
        p1Retry = false;
        p2Retry = false;
        winner = null;
        matchPointState = null;
        gameState = "playing";

        p1TouchId = null;
        p2TouchId = null;

        resetPuck('p1');
        p1Target = { x: 120, y: CANVAS_HEIGHT / 2 };
        p2Target = { x: CANVAS_WIDTH - 120, y: CANVAS_HEIGHT / 2 };
        p1.x = p1Target.x; p1.y = p1Target.y;
        p2.x = p2Target.x; p2.y = p2Target.y;

        document.getElementById('p1Score').innerText = "0";
        document.getElementById('p2Score').innerText = "0";

        updateUIByState();
    }

    function clickLeave() {
        if (conn && conn.open) {
            conn.send({ type: "leave" });
            conn.close();
        }
        if (peer) {
            peer.destroy();
        }

        peer = null;
        conn = null;
        gameMode = "none";
        gameState = "lobby";

        document.getElementById("resultOverlay").style.display = "none";
        document.getElementById("lobbyOverlay").style.display = "flex";
        showHomeMenu();
    }

    function updateUIByState() {
        const mpBanner = document.getElementById("matchPointBanner");
        const resultOverlay = document.getElementById("resultOverlay");
        const resultTitle = document.getElementById("resultTitle");
        const resultScoreDetail = document.getElementById("resultScoreDetail");
        const retryBtn = document.getElementById("retryBtn");
        const retryStatusText = document.getElementById("retryStatusText");

        // マッチポイント表示
        if (gameState === "playing" && matchPointState) {
            mpBanner.style.display = "block";
            mpBanner.innerText = `MATCH POINT (${matchPointState.toUpperCase()})`;
        } else {
            mpBanner.style.display = "none";
        }

        // リザルト画面表示
        if (gameState === "ended") {
            resultOverlay.style.display = "flex";

            if (gameMode === "local") {
                resultTitle.innerText = winner === "p1" ? "1P WIN!" : "2P WIN!";
                resultTitle.className = winner === "p1" ? "p1-win-text" : "p2-win-text";
                retryBtn.disabled = false;
                retryStatusText.innerText = "";
            } else {
                let isIWin = (gameMode === "host" && winner === "p1") || (gameMode === "guest" && winner === "p2");
                if (isIWin) {
                    resultTitle.innerText = "YOU WIN!";
                    resultTitle.className = "win-text";
                } else {
                    resultTitle.innerText = "YOU LOSE!";
                    resultTitle.className = "lose-text";
                }

                let myRetry = gameMode === "host" ? p1Retry : p2Retry;
                let otherRetry = gameMode === "host" ? p2Retry : p1Retry;

                if (myRetry) {
                    retryBtn.disabled = true;
                    retryStatusText.innerText = otherRetry ? "再開中..." : "相手の準備待ち...";
                } else {
                    retryBtn.disabled = false;
                    retryStatusText.innerText = otherRetry ? "相手は準備完了しています！" : "";
                }
            }

            resultScoreDetail.innerText = `スコア: 1P ${p1.score} - ${p2.score} 2P`;
        } else {
            resultOverlay.style.display = "none";
        }
    }

    // --- 物理演算 ---
    function resetPuck(scoredBy) {
        puck.x = CANVAS_WIDTH / 2;
        puck.y = CANVAS_HEIGHT / 2;
        puck.vx = 0;
        puck.vy = 0;
        puck.x += (scoredBy === 'p2') ? -80 : 80;
    }

    function resolveWallCollision(p) {
        let inGoalY = (p.y - p.r * 0.3 >= goalTop) && (p.y + p.r * 0.3 <= goalBottom);
        if (p.y - p.r < 0) { p.y = p.r; if (p.vy < 0) p.vy *= -WALL_RESTITUTION; }
        else if (p.y + p.r > CANVAS_HEIGHT) { p.y = CANVAS_HEIGHT - p.r; if (p.vy > 0) p.vy *= -WALL_RESTITUTION; }

        if (p.x - p.r < 0) {
            if (!inGoalY) { p.x = p.r; if (p.vx < 0) p.vx *= -WALL_RESTITUTION; }
        } else if (p.x + p.r > CANVAS_WIDTH) {
            if (!inGoalY) { p.x = CANVAS_WIDTH - p.r; if (p.vx > 0) p.vx *= -WALL_RESTITUTION; }
        }
    }

    function resolveMalletCollision(p, m) {
        let dx = p.x - m.x;
        let dy = p.y - m.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        let minDist = p.r + m.r;

        if (dist < minDist) {
            let nx = dx / (dist || 1);
            let ny = dy / (dist || 1);
            let overlap = minDist - dist;

            p.x += nx * overlap;
            p.y += ny * overlap;

            let inGoalY = (p.y - p.r * 0.3 >= goalTop) && (p.y + p.r * 0.3 <= goalBottom);
            let wallHit = false;

            if (p.y - p.r < 0) { p.y = p.r; wallHit = true; }
            else if (p.y + p.r > CANVAS_HEIGHT) { p.y = CANVAS_HEIGHT - p.r; wallHit = true; }
            if (!inGoalY) {
                if (p.x - p.r < 0) { p.x = p.r; wallHit = true; }
                else if (p.x + p.r > CANVAS_WIDTH) { p.x = CANVAS_WIDTH - p.r; wallHit = true; }
            }

            let dx2 = p.x - m.x;
            let dy2 = p.y - m.y;
            let dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
            if (dist2 < minDist) {
                let overlap2 = minDist - dist2;
                m.x -= (dx2 / dist2) * overlap2;
                m.y -= (dy2 / dist2) * overlap2;
                
                if (wallHit) {
                    p.vx += m.vx * 0.9;
                    p.vy += m.vy * 0.9;
                }
            }

            let vRel = (p.vx - m.vx) * nx + (p.vy - m.vy) * ny;
            if (vRel < 0) {
                let impulse = -(1 + MALLET_RESTITUTION) * vRel * 0.85;
                p.vx += impulse * nx;
                p.vy += impulse * ny;
            }
        }
    }

    function updatePhysics(tP1x, tP1y, tP2x, tP2y) {
        let dt = 1 / SUB_STEPS;

        p1.vx = tP1x - p1.x;
        p1.vy = tP1y - p1.y;
        p2.vx = tP2x - p2.x;
        p2.vy = tP2y - p2.y;

        for (let step = 0; step < SUB_STEPS; step++) {
            puck.x += puck.vx * dt;
            puck.y += puck.vy * dt;
            p1.x += p1.vx * dt;
            p1.y += p1.vy * dt;
            p2.x += p2.vx * dt;
            p2.y += p2.vy * dt;

            p1.x = Math.max(p1.r, Math.min(CANVAS_WIDTH / 2 - p1.r, p1.x));
            p1.y = Math.max(p1.r, Math.min(CANVAS_HEIGHT - p1.r, p1.y));
            p2.x = Math.max(CANVAS_WIDTH / 2 + p2.r, Math.min(CANVAS_WIDTH - p2.r, p2.x));
            p2.y = Math.max(p2.r, Math.min(CANVAS_HEIGHT - p2.r, p2.y));

            resolveWallCollision(puck);
            resolveMalletCollision(puck, p1);
            resolveMalletCollision(puck, p2);
            resolveWallCollision(puck);

            if (puck.x < -puck.r) return 'goal_p2';
            if (puck.x > CANVAS_WIDTH + puck.r) return 'goal_p1';
        }

        puck.vx *= FRICTION;
        puck.vy *= FRICTION;

        let speed = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
        if (speed > MAX_PUCK_SPEED) {
            puck.vx = (puck.vx / speed) * MAX_PUCK_SPEED;
            puck.vy = (puck.vy / speed) * MAX_PUCK_SPEED;
        }

        return null;
    }

    function update() {
        // ローカルおよびホスト側で物理演算を実行
        if ((gameMode !== "local" && gameMode !== "host") || gameState !== "playing") return;

        let targetP1X = Math.max(p1.r, Math.min(CANVAS_WIDTH / 2 - p1.r, p1Target.x));
        let targetP1Y = Math.max(p1.r, Math.min(CANVAS_HEIGHT - p1.r, p1Target.y));
        let targetP2X = Math.max(CANVAS_WIDTH / 2 + p2.r, Math.min(CANVAS_WIDTH - p2.r, p2Target.x));
        let targetP2Y = Math.max(p2.r, Math.min(CANVAS_HEIGHT - p2.r, p2Target.y));

        let result = updatePhysics(targetP1X, targetP1Y, targetP2X, targetP2Y);
        
        if (result === 'goal_p2') {
            p2.score++;
            document.getElementById('p2Score').innerText = p2.score;
            resetPuck('p2');
            checkTableTennisRules();
        } else if (result === 'goal_p1') {
            p1.score++;
            document.getElementById('p1Score').innerText = p1.score;
            resetPuck('p1');
            checkTableTennisRules();
        }

        // オンライン接続時：ゲストへ状態同期
        if (gameMode === "host" && conn && conn.open) {
            conn.send({
                type: "state",
                puck: puck,
                p1: p1,
                p2: p2,
                gameState: gameState,
                winner: winner,
                matchPoint: matchPointState,
                p1Retry: p1Retry,
                p2Retry: p2Retry
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // センターライン＆サークル
        ctx.strokeStyle = "rgba(0, 0, 0, 0.12)";
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(CANVAS_WIDTH / 2, 0); ctx.lineTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT); ctx.stroke();
        ctx.beginPath(); ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, CANVAS_HEIGHT / 4.5, 0, Math.PI * 2); ctx.stroke();

        // ゴールエリア
        ctx.fillStyle = "rgba(44, 62, 80, 0.25)";
        ctx.fillRect(0, goalTop, 12, goalHeight);
        ctx.fillRect(CANVAS_WIDTH - 12, goalTop, 12, goalHeight);

        ctx.strokeStyle = "rgba(231, 76, 60, 0.8)";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(0, goalTop); ctx.lineTo(0, goalBottom);
        ctx.moveTo(CANVAS_WIDTH, goalTop); ctx.lineTo(CANVAS_WIDTH, goalBottom);
        ctx.stroke();

        function drawEntity(obj, isMallet, isHolding) {
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, obj.r, 0, Math.PI * 2);
            ctx.fillStyle = obj.color;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 4;
            ctx.fill();
            ctx.shadowColor = 'transparent';

            if (isMallet) {
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, obj.r * 0.45, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
                ctx.fill();

                if (isHolding) {
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }
            } else {
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, obj.r * 0.7, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        drawEntity(p1, true, p1TouchId !== null);
        drawEntity(p2, true, p2TouchId !== null);
        drawEntity(puck, false, false);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
